.links{display:grid;gap:10px}
.link{--accent:#4f9bff;min-height:59px;display:flex;align-items:center;gap:13px;padding:9px 13px;border:1px solid color-mix(in srgb,var(--accent) 70%,transparent);border-radius:17px;text-decoration:none;color:var(--text);background:linear-gradient(105deg,color-mix(in srgb,var(--accent) 13%,#09142e),#ffffff05);transition:transform .22s,border-color .22s,box-shadow .22s,background .22s;-webkit-tap-highlight-color:transparent}
.link:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 26px color-mix(in srgb,var(--accent) 19%,transparent);background:linear-gradient(105deg,color-mix(in srgb,var(--accent) 22%,#09142e),#ffffff0a)}
.link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.label{flex:1;font-size:14px;font-weight:600}.arrow{color:#aab6d6;font-size:12px;transition:transform .2s}.link:hover .arrow{transform:translateX(3px);color:var(--accent)}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
